[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Exclude archive/ (non-canonical scripts); only canonical py_ntcpx is installable.
exclude = ["archive*"]

[project]
name = "py_ntcpx"
version = "1.1.3"
description = "NTCP analysis and ML pipeline for head & neck cancer"
authors = [
    {name = "Kalyan Mondal", email = "kalyanmondal.res@gmail.com"},
    {name = "Abhijit Mandal"},
    {name = "Anuj Vijay"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90", "I"]
